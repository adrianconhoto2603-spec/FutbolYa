<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>App de Fútbol Escolar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>App de Fútbol Escolar</h1>
  </header>

  <main>
    <section>
      <h2>Publicar nuevo partido</h2>
      <form id="formPartido">
        <input type="text" id="nombrePartido" placeholder="Nombre del partido" required>
        <input type="date" id="fecha" required>
        <input type="time" id="hora" required>
        <input type="text" id="lugar" placeholder="Lugar" required>
        <input type="number" id="jugadores" placeholder="Cantidad de jugadores" required>
        <button type="submit">Publicar</button>
      </form>
    </section>

    <section>
      <h2>Partidos publicados</h2>
      <div id="listaPartidos"></div>
    </section>
  </main>

  <footer>
    <p>© 2026 App de Fútbol Escolar</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
