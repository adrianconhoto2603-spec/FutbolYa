<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>App de Fútbol Escolar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Publicar Partido</h1>

  <!-- Formulario para crear partidos -->
  <form id="formPartido">
    <input type="text" id="nombrePartido" placeholder="Nombre del partido" required>
    <input type="date" id="fecha" required>
    <input type="time" id="hora" required>
    <input type="text" id="lugar" placeholder="Lugar" required>
    <input type="number" id="jugadores" placeholder="Cantidad de jugadores" required>
    <button type="submit">Publicar</button>
  </form>

  <!-- Sección donde se mostrarán los partidos -->
  <h2>Partidos publicados</h2>
  <section id="listaPartidos">
    <!-- Aquí se insertan las tarjetas dinámicamente -->
  </section>

  <script src="script.js"></script>
</body>
</html>
